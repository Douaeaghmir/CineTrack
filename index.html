<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <header class="bg-black h-20 px-10 border-b border-white">
        <div class="flex items-center justify-between h-full">
            <div class="flex items-center">
                <img src="src/img/logo.png" alt="action logo" class="w-20 h-20 object-contain">
                <img src="src/img/title.png" alt="title" class="w-32 h-32 object-contain">
            </div>
            <div class="flex items-center gap-8">
                <select name="kind" id="kind" class="font-['inter'] border-2 border-red-800 bg-gray-200 rounded-md">
                    <option value="tous">tous</option>
                    <option value="Series">Series</option>
                    <option value="movie">Films</option>
                </select>
                <input type="text" name="movie_title" id="movie" placeholder="e.g., Fight Club"
                    class="text-center rounded-md border-2 border-red-800 bg-gray-200 rounded-md outline-none">
                <img src="src/img/search.png" alt="recherch" class="w-8 h-8">
            </div>
        </div>
    </header>
    <main class="grid grid-cols-4 min-h-screen">
        <section id="movies" class="col-span-3 border-r border-white p-6 bg-black">
            <p class="text-white text-xl font-['Robot']">Movies</p>
            <section id="movie-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mx-4 my-4"></section>
            <section id="pagination" class="flex justify-center items-center my-8 gap-4"></section>
        </section>
        <section id="favourites" class="col-span-1 p-6 bg-black">
            <p class="text-white text-xl font-['poppings']">Favourite ♡</p>
        </section>
    </main>
    <footer class="flex justify-center bg-black border-t border-white">
        <p class="text-white">© CineTrack . 2026</p>
    </footer>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
