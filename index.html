<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>CineTrack</title>
</head>

<body class="bg-black min-h-screen">

    <header class="bg-black px-4 sm:px-6 lg:px-10 py-3 border-b border-red-800">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">

            <div class="flex items-center justify-center shrink-0">
                <img src="src/img/logo.png" alt="Action logo"
                    class="w-14 h-14 sm:w-16 sm:h-16 lg:w-20 lg:h-20 object-contain">

                <img src="src/img/title.png" alt="CineTrack"
                    class="w-28 h-14 sm:w-32 sm:h-16 lg:w-36 lg:h-20 object-contain">
            </div>

            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto">
                <select name="kind" id="kind"
                    class="font-['inter'] border-2 border-red-800 rounded-md px-2 py-1 text-xs bg-black text-red-800 sm:text-sm shrink-0 h-[32px]">
                    <option value="tous">Tous</option>
                    <option value="Series">Series</option>
                    <option value="movie">Films</option>
                </select>

                <input type="text" name="movie_title" id="movie" placeholder="e.g., Fight Club"
                    class="min-w-0 flex-1 sm:w-40 lg:w-52 h-[30px] p-2 text-center placeholder-red-800 rounded-md border-2 border-red-800 bg-black outline-none">

                <img src="src/img/search.png" alt="Search" class="w-7 h-7 sm:w-8 sm:h-8 object-contain shrink-0">
            </div>

        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-4 min-h-screen">

        <section id="movies"
            class="col-span-1 lg:col-span-3 border-b lg:border-b-0 lg:border-r border-red-800 p-4 sm:p-6 bg-black min-w-0">

            <p class="text-white text-xl font-['Robot'] mb-4">Movies</p>

            <section id="movie-container" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5 sm:gap-6">
            </section>

            <section id="pagination" class="flex flex-wrap justify-center items-center my-8 gap-3">
            </section>

        </section>

        <section class="col-span-1 p-4 sm:p-6 bg-black min-w-0">

            <p class="text-white text-xl font-['poppings'] mb-4">Favourite ♡</p>

            <div id="favourites" class="flex flex-col gap-3">
            </div>

        </section>

    </main>

    <footer class="flex justify-center items-center bg-black border-t border-red-800 py-4 px-3">
        <p class="text-white text-sm text-center">© CineTrack · 2026</p>
    </footer>

    <div id="movieModal"
        class="hidden fixed inset-0 bg-black/80 z-50 items-center justify-center p-3 sm:p-5 overflow-y-auto">

        <div class="bg-zinc-900 text-white w-full max-w-2xl rounded-xl p-5 sm:p-6 relative my-auto">

            <button id="closeModal" class="absolute top-3 right-4 text-2xl text-white hover:text-red-500">
                &times;
            </button>

            <div class="flex flex-col sm:flex-row gap-5 sm:gap-6">

                <img id="modalImage" src="" alt="Movie poster"
                    class="w-full max-w-[180px] h-64 sm:w-48 sm:h-72 mx-auto sm:mx-0 rounded-lg object-cover">

                <div class="flex-1 min-w-0 pt-7 sm:pt-0">

                    <h2 id="modalTitle" class="text-2xl font-bold mb-3 break-words"></h2>

                    <p id="modalDescription" class="text-gray-300 mb-4 break-words"></p>

                    <p id="modalTime" class="text-gray-300 mb-4"></p>

                    <div id="seasonsContainer" class="hidden mt-4 mb-4">

                        <label for="seasonSelect" class="text-white block mb-2">
                            Choose a season:
                        </label>

                        <select id="seasonSelect" class="bg-zinc-800 text-white p-2 rounded-md w-full sm:w-auto">
                        </select>

                    </div>

                    <div class="mb-5">

                        <p class="text-yellow-400 font-bold">⭐ Rating</p>

                        <p id="modalRating"></p>

                    </div>

                    <button id="watchMovie"
                        class="bg-red-600 px-5 py-2 rounded-lg hover:bg-red-700 transition-colors w-full sm:w-auto">
                        Watch movie
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script type="module" src="src/js/main.js"></script>

</body>

</html>
